<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TikTok門番</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --primary: #3b82f6;
            --btn-bg: #1e293b;
            --btn-hover: #334155;
            --color-good: #22c55e;
            --color-warn: #eab308;
            --color-bad: #ef4444;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', Meiryo, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            text-align: center;
        }

        #app {
            width: 100%;
            max-width: 400px;
            padding: 24px;
            box-sizing: border-box;
        }

        .screen {
            display: none;
            flex-direction: column;
            gap: 24px;
            animation: fadeIn 0.4s ease-out;
        }

        .screen.active {
            display: flex;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(15px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        h1 {
            font-size: 24px;
            margin-bottom: 8px;
            font-weight: 600;
            color: var(--text-muted);
        }

        h2 {
            font-size: 22px;
            margin: 0;
            font-weight: normal;
        }

        p {
            font-size: 16px;
            line-height: 1.6;
            margin: 0;
            color: var(--text-muted);
        }

        .question-block {
            display: flex;
            flex-direction: column;
            gap: 20px;
            background: #1e293b;
            padding: 32px 24px;
            border-radius: 20px;
        }

        .question-block label {
            font-size: 20px;
            font-weight: 500;
        }

        input[type="time"],
        input[type="number"] {
            width: 100%;
            padding: 16px;
            font-size: 28px;
            background: #0f172a;
            border: 2px solid #334155;
            color: #fff;
            border-radius: 12px;
            text-align: center;
            box-sizing: border-box;
            outline: none;
            transition: border-color 0.2s;
        }

        input[type="time"]:focus,
        input[type="number"]:focus {
            border-color: var(--primary);
        }

        input[type="time"]::-webkit-calendar-picker-indicator {
            filter: invert(1);
            font-size: 24px;
        }

        button {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 18px;
            font-size: 18px;
            border-radius: 14px;
            cursor: pointer;
            transition: all 0.2s;
            font-weight: bold;
            width: 100%;
        }

        button:active {
            transform: scale(0.98);
        }

        button.secondary {
            background-color: transparent;
            border: 2px solid #334155;
            color: var(--text-color);
        }

        .sleep-time-display {
            font-size: 44px;
            font-weight: bold;
            margin: 16px 0;
        }

        .sleep-good {
            color: var(--color-good);
        }

        .sleep-warn {
            color: var(--color-warn);
        }

        .sleep-bad {
            color: var(--color-bad);
        }

        .btn-choice-container {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .btn-stop {
            background-color: #10b981;
            padding: 22px;
            font-size: 20px;
        }

        .btn-continue {
            background-color: #334155;
            color: var(--text-muted);
            padding: 22px;
            font-size: 20px;
        }

        .history-container {
            display: flex;
            justify-content: space-between;
            background: #1e293b;
            padding: 20px 16px;
            border-radius: 16px;
            margin-top: 16px;
        }

        .history-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
        }

        .history-day {
            font-size: 13px;
            color: var(--text-muted);
        }

        .history-mark {
            font-size: 24px;
            font-weight: bold;
        }

        .mark-good {
            color: var(--color-good);
        }

        .mark-bad {
            color: #475569;
        }

        .mark-none {
            color: #334155;
            font-weight: normal;
        }

        .mt-8 {
            margin-top: 32px;
        }
    </style>
</head>

<body>

    <div id="app">
        <!-- Screen 1-1: Time Now -->
        <div id="screen-1-1" class="screen active">
            <h1>TikTokを開く前に</h1>
            <div class="question-block">
                <label for="input-time-now">今、何時ですか？</label>
                <input type="time" id="input-time-now" required>
                <button onclick="nextToDuration()">次へ</button>
            </div>
        </div>

        <!-- Screen 1-2: Watch Duration -->
        <div id="screen-1-2" class="screen">
            <h1>TikTokを開く前に</h1>
            <div class="question-block">
                <label for="input-duration">何分くらい見る予定ですか？</label>
                <input type="number" id="input-duration" value="5" min="1" required>
                <button onclick="nextToWakeUp()">次へ</button>
            </div>
        </div>

        <!-- Screen 1-3: Wake up time -->
        <div id="screen-1-3" class="screen">
            <h1>TikTokを開く前に</h1>
            <div class="question-block">
                <label for="input-wakeup">明日、何時に起きますか？</label>
                <input type="time" id="input-wakeup" required>
                <button onclick="nextToPrediction()">結果を見る</button>
            </div>
        </div>

        <!-- Screen 2: Prediction -->
        <div id="screen-2" class="screen">
            <h2>予定通りなら、<br>今夜の睡眠時間は</h2>
            <div id="sleep-time-value" class="sleep-time-display">--時間 --分</div>
            <p id="sleep-comparison">計算中...</p>
            <button class="mt-8" onclick="nextToChoice()">次へ</button>
        </div>

        <!-- Screen 3: Choice -->
        <div id="screen-3" class="screen">
            <h2>今のあなたの選択は？</h2>
            <div class="btn-choice-container mt-8">
                <button class="btn-stop" onclick="makeChoice('slept')">やめて寝る</button>
                <button class="btn-continue" onclick="makeChoice('watched')">それでも見る</button>
            </div>
        </div>

        <!-- Screen 4: Record -->
        <div id="screen-4" class="screen">
            <h2 id="result-title"></h2>
            <div class="history-container" id="history-days">
                <!-- Dynamically populated -->
            </div>
            <p class="mt-8">明日の朝、結果を見にきてね。</p>
        </div>
    </div>

    <script>
        const STORE_KEY = 'tiktok_gatekeeper_history';

        const screens = [
            document.getElementById('screen-1-1'),
            document.getElementById('screen-1-2'),
            document.getElementById('screen-1-3'),
            document.getElementById('screen-2'),
            document.getElementById('screen-3'),
            document.getElementById('screen-4')
        ];

        let state = {
            timeNow: '',
            watchMinutes: 5,
            wakeUpTime: ''
        };

        function showScreen(id) {
            screens.forEach(s => s.classList.remove('active'));
            document.getElementById(id).classList.add('active');
        }

        function init() {
            const now = new Date();
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            document.getElementById('input-time-now').value = `${hours}:${minutes}`;

            // Default wakeup time to 7:00 AM
            document.getElementById('input-wakeup').value = '07:00';
        }

        function nextToDuration() {
            state.timeNow = document.getElementById('input-time-now').value;
            if (state.timeNow) showScreen('screen-1-2');
        }

        function nextToWakeUp() {
            state.watchMinutes = parseInt(document.getElementById('input-duration').value, 10);
            if (!isNaN(state.watchMinutes)) showScreen('screen-1-3');
        }

        function nextToPrediction() {
            state.wakeUpTime = document.getElementById('input-wakeup').value;
            if (state.wakeUpTime) {
                calculatePrediction();
                showScreen('screen-2');
            }
        }

        function calculatePrediction() {
            const [nowH, nowM] = state.timeNow.split(':').map(Number);
            const [wakeH, wakeM] = state.wakeUpTime.split(':').map(Number);

            const nowMinutes = nowH * 60 + nowM;
            let wakeMinutes = wakeH * 60 + wakeM;

            if (wakeMinutes <= nowMinutes) {
                wakeMinutes += 24 * 60;
            }

            const sleepTimeInMinutes = wakeMinutes - (nowMinutes + state.watchMinutes);

            const displayEl = document.getElementById('sleep-time-value');
            const comparisonEl = document.getElementById('sleep-comparison');

            if (sleepTimeInMinutes < 0) {
                displayEl.textContent = '睡眠なし';
                displayEl.className = 'sleep-time-display sleep-bad';
            } else {
                const sleepH = Math.floor(sleepTimeInMinutes / 60);
                const sleepM = sleepTimeInMinutes % 60;
                displayEl.textContent = `${sleepH}時間 ${sleepM}分`;

                displayEl.className = 'sleep-time-display';
                if (sleepTimeInMinutes < 360) {
                    displayEl.classList.add('sleep-bad');
                } else if (sleepTimeInMinutes < 420) {
                    displayEl.classList.add('sleep-warn');
                } else {
                    displayEl.classList.add('sleep-good');
                }
            }

            const history = getHistory();
            if (history.length > 0) {
                let totalSleep = 0;
                let count = 0;
                history.forEach(record => {
                    if (record.sleepTimeInMinutes !== undefined) {
                        totalSleep += record.sleepTimeInMinutes;
                        count++;
                    }
                });

                if (count > 0) {
                    const avgSleep = Math.round(totalSleep / count);
                    const diff = sleepTimeInMinutes - avgSleep;
                    if (diff > 0) {
                        comparisonEl.textContent = `過去の平均睡眠より ${diff}分 長いです`;
                    } else if (diff < 0) {
                        comparisonEl.textContent = `過去の平均睡眠より ${Math.abs(diff)}分 短いです`;
                    } else {
                        comparisonEl.textContent = `過去の平均睡眠と同じくらいです`;
                    }
                } else {
                    comparisonEl.textContent = '今日が最初の記録です';
                }
            } else {
                comparisonEl.textContent = '今日が最初の記録です';
            }
        }

        function nextToChoice() {
            showScreen('screen-3');
        }

        function makeChoice(choice) {
            const today = new Date();
            // 深夜5時までは前日としてカウントする（夜の記録を1日として扱うため）
            today.setHours(today.getHours() - 5);
            const dateStr = today.toISOString().split('T')[0];

            const [nowH, nowM] = state.timeNow.split(':').map(Number);
            const [wakeH, wakeM] = state.wakeUpTime.split(':').map(Number);
            const nowMinutes = nowH * 60 + nowM;
            let wakeMinutes = wakeH * 60 + wakeM;
            if (wakeMinutes <= nowMinutes) wakeMinutes += 24 * 60;
            const sleepTimeInMinutes = wakeMinutes - (nowMinutes + state.watchMinutes);

            const record = {
                date: dateStr,
                timeNow: state.timeNow,
                watchMinutes: state.watchMinutes,
                wakeUpTime: state.wakeUpTime,
                sleepTimeInMinutes: Math.max(0, sleepTimeInMinutes),
                choice: choice
            };

            saveRecord(record);
            renderHistory(choice);
            showScreen('screen-4');
        }

        function getHistory() {
            const data = localStorage.getItem(STORE_KEY);
            return data ? JSON.parse(data) : [];
        }

        function saveRecord(newRecord) {
            let history = getHistory();
            const existingIndex = history.findIndex(r => r.date === newRecord.date);
            if (existingIndex >= 0) {
                history[existingIndex] = newRecord;
            } else {
                history.push(newRecord);
            }
            if (history.length > 30) history = history.slice(history.length - 30);
            localStorage.setItem(STORE_KEY, JSON.stringify(history));
        }

        function renderHistory(todayChoice) {
            const resultTitle = document.getElementById('result-title');
            if (todayChoice === 'slept') {
                resultTitle.innerHTML = '素晴らしい選択です。<br>おやすみなさい。';
            } else {
                resultTitle.innerHTML = 'わかりました。<br>時間を意識して楽しんでください。';
            }

            const history = getHistory();
            const historyEl = document.getElementById('history-days');
            historyEl.innerHTML = '';

            const today = new Date();
            today.setHours(today.getHours() - 5);

            const daysOfWeek = ['日', '月', '火', '水', '木', '金', '土'];

            // 過去7日間を描画
            for (let i = 6; i >= 0; i--) {
                const d = new Date(today);
                d.setDate(d.getDate() - i);
                const dateStr = d.toISOString().split('T')[0];

                const record = history.find(r => r.date === dateStr);

                const dayDiv = document.createElement('div');
                dayDiv.className = 'history-item';

                const dayLabel = document.createElement('div');
                dayLabel.className = 'history-day';
                dayLabel.textContent = daysOfWeek[d.getDay()];

                const markDiv = document.createElement('div');
                markDiv.className = 'history-mark';

                if (record) {
                    if (record.choice === 'slept') {
                        markDiv.textContent = '〇';
                        markDiv.classList.add('mark-good');
                    } else {
                        markDiv.textContent = '×';
                        markDiv.classList.add('mark-bad');
                    }
                } else {
                    markDiv.textContent = '-';
                    markDiv.classList.add('mark-none');
                }

                dayDiv.appendChild(dayLabel);
                dayDiv.appendChild(markDiv);
                historyEl.appendChild(dayDiv);
            }
        }

        // アプリ起動
        init();
    </script>
</body>

</html>
