<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TikTok門番 v2</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #09090b;
            --bg-panel: rgba(24, 24, 27, 0.7);
            --text-main: #f8fafc;
            --text-sub: #a1a1aa;
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --good: #10b981;
            --warn: #f59e0b;
            --bad: #ef4444;
            --glass-border: rgba(255, 255, 255, 0.1);
        }

        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #0f172a 0%, #000000 100%);
            color: var(--text-main);
            font-family: 'Inter', 'Noto Sans JP', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            text-align: center;
            overflow: hidden;
        }

        #app {
            width: 100%;
            max-width: 420px;
            padding: 24px;
            box-sizing: border-box;
            position: relative;
            z-index: 10;
        }

        /* 背景のオーブ（装飾） */
        .ambient-orb {
            position: absolute;
            width: 300px;
            height: 300px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(99,102,241,0.15) 0%, rgba(0,0,0,0) 70%);
            top: -100px;
            left: -100px;
            z-index: -1;
            pointer-events: none;
        }

        .screen {
            display: none;
            flex-direction: column;
            gap: 28px;
            opacity: 0;
            transform: translateY(20px) scale(0.95);
            transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .screen.active {
            display: flex;
            opacity: 1;
            transform: translateY(0) scale(1);
        }

        h1 {
            font-size: 26px;
            margin: 0;
            font-weight: 700;
            letter-spacing: 1px;
            background: linear-gradient(to right, #e2e8f0, #94a3b8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        h2 {
            font-size: 22px;
            margin: 0;
            font-weight: 500;
            line-height: 1.4;
        }

        p {
            font-size: 15px;
            line-height: 1.6;
            margin: 0;
            color: var(--text-sub);
        }

        .glass-panel {
            background: var(--bg-panel);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            padding: 36px 24px;
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        label {
            font-size: 18px;
            font-weight: 600;
            color: var(--text-main);
        }

        input[type="time"],
        input[type="number"] {
            width: 100%;
            padding: 16px;
            font-size: 32px;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid var(--glass-border);
            color: #fff;
            border-radius: 16px;
            text-align: center;
            box-sizing: border-box;
            outline: none;
            transition: all 0.3s ease;
            font-family: 'Inter', sans-serif;
            font-weight: 600;
        }

        input[type="time"]:focus,
        input[type="number"]:focus {
            border-color: var(--primary);
            box-shadow: 0 0 15px rgba(99, 102, 241, 0.3);
        }
        
        input[type="time"]::-webkit-calendar-picker-indicator {
            filter: invert(1);
            opacity: 0.6;
            cursor: pointer;
        }

        button {
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-hover) 100%);
            color: white;
            border: none;
            padding: 20px;
            font-size: 18px;
            border-radius: 16px;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
            font-weight: 700;
            width: 100%;
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.3);
            letter-spacing: 1px;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(99, 102, 241, 0.4);
        }

        button:active {
            transform: scale(0.97);
        }

        .sleep-time-display {
            font-size: 56px;
            font-weight: 800;
            margin: 10px 0;
            font-family: 'Inter', sans-serif;
            text-shadow: 0 0 20px rgba(255,255,255,0.1);
        }

        .sleep-good { color: var(--good); text-shadow: 0 0 20px rgba(16, 185, 129, 0.3); }
        .sleep-warn { color: var(--warn); text-shadow: 0 0 20px rgba(245, 158, 11, 0.3); }
        .sleep-bad { color: var(--bad); text-shadow: 0 0 20px rgba(239, 68, 68, 0.3); }

        .btn-choice-container {
            display: flex;
            flex-direction: column;
            gap: 16px;
            margin-top: 20px;
        }

        .btn-stop {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            box-shadow: 0 4px 15px rgba(16, 185, 129, 0.3);
            padding: 24px;
            font-size: 22px;
        }

        .btn-stop:hover {
            box-shadow: 0 8px 20px rgba(16, 185, 129, 0.4);
            transform: translateY(-2px);
        }

        /* それでも見るボタンは目立たなくし、意識的アクションを求める */
        .btn-continue {
            background: transparent;
            color: var(--text-sub);
            border: 1px solid var(--glass-border);
            box-shadow: none;
            padding: 18px;
            font-size: 16px;
            font-weight: 500;
        }

        .btn-continue:hover {
            background: rgba(255, 255, 255, 0.05);
            color: white;
            box-shadow: none;
            transform: none;
        }

        .history-container {
            display: flex;
            justify-content: space-between;
            background: rgba(0,0,0,0.3);
            border: 1px solid var(--glass-border);
            padding: 24px 16px;
            border-radius: 20px;
            margin-top: 10px;
        }

        .history-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
        }

        .history-day {
            font-size: 12px;
            color: var(--text-sub);
            font-weight: 600;
        }

        .history-mark {
            font-size: 20px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: rgba(255,255,255,0.05);
        }

        .mark-good { color: var(--good); background: rgba(16,185,129,0.1); }
        .mark-bad { color: var(--bad); background: rgba(239,68,68,0.1); }
        .mark-none { color: var(--text-sub); }

        .time-now-display {
            font-size: 14px;
            color: var(--text-sub);
            margin-bottom: -10px;
            font-weight: 500;
        }

    </style>
</head>

<body>
    <div class="ambient-orb"></div>
    <div id="app">
        
        <!-- Screen 1: Duration & Time info -->
        <div id="screen-1" class="screen active">
            <h1>TikTok門番 v2</h1>
            <div class="glass-panel">
                <div class="time-now-display" id="auto-time-display">現在時刻: --:--</div>
                <label for="input-duration">何分だけ見る予定ですか？</label>
                <div style="display: flex; align-items: center; gap: 10px; justify-content: center;">
                    <input type="number" id="input-duration" value="5" min="1" required style="width: 120px;">
                    <span style="font-size: 24px; font-weight: 600; color: var(--text-sub);">分</span>
                </div>
                <button onclick="nextToWakeUp()">次へ</button>
            </div>
        </div>

        <!-- Screen 2: Wake up time -->
        <div id="screen-2" class="screen">
            <h1>TikTok門番 v2</h1>
            <div class="glass-panel">
                <label for="input-wakeup">明日、何時に起きますか？</label>
                <input type="time" id="input-wakeup" required>
                <button onclick="nextToPrediction()">結果を見る</button>
            </div>
        </div>

        <!-- Screen 3: Prediction -->
        <div id="screen-3" class="screen">
            <h2>予定通りなら、<br>今夜の睡眠時間は...</h2>
            <div class="glass-panel" style="padding: 40px 20px;">
                <div id="sleep-time-value" class="sleep-time-display">--:--</div>
                <p id="sleep-comparison">計算中...</p>
            </div>
            <button onclick="nextToChoice()">判断する</button>
        </div>

        <!-- Screen 4: Choice -->
        <div id="screen-4" class="screen">
            <h2>今のあなたの選択は？</h2>
            <div class="btn-choice-container">
                <button class="btn-stop" onclick="makeChoice('slept')">やめて寝る</button>
                <button class="btn-continue" onclick="makeChoice('watched')">それでも見る (非推奨)</button>
            </div>
        </div>

        <!-- Screen 5: Record -->
        <div id="screen-5" class="screen">
            <h2 id="result-title" style="margin-bottom: 10px;"></h2>
            <p id="result-subtitle"></p>
            <div class="history-container" id="history-days">
                <!-- Dynamically populated -->
            </div>
            <button onclick="location.reload()" style="margin-top: 24px; background: transparent; border: 1px solid var(--glass-border); color: var(--text-main);">最初に戻る</button>
        </div>
    </div>

    <script>
        const STORE_KEY = 'tiktok_gatekeeper_history';
        const SETTINGS_KEY = 'tiktok_gatekeeper_settings';

        const screens = [
            document.getElementById('screen-1'),
            document.getElementById('screen-2'),
            document.getElementById('screen-3'),
            document.getElementById('screen-4'),
            document.getElementById('screen-5')
        ];

        let state = {
            timeNow: '',
            watchMinutes: 5,
            wakeUpTime: '07:00'
        };

        function showScreen(id) {
            screens.forEach(s => {
                s.classList.remove('active');
                s.style.display = 'none'; // reset
            });
            
            const target = document.getElementById(id);
            target.style.display = 'flex';
            // Force reflow
            void target.offsetWidth;
            target.classList.add('active');
        }

        function init() {
            updateCurrentTime();
            setInterval(updateCurrentTime, 60000); // 1分ごとに更新

            // 設定を読み込む
            const settingsStr = localStorage.getItem(SETTINGS_KEY);
            if (settingsStr) {
                const settings = JSON.parse(settingsStr);
                if (settings.lastWakeUpTime) {
                    state.wakeUpTime = settings.lastWakeUpTime;
                }
            }
            document.getElementById('input-wakeup').value = state.wakeUpTime;
        }

        function updateCurrentTime() {
            const now = new Date();
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            state.timeNow = `${hours}:${minutes}`;
            document.getElementById('auto-time-display').textContent = `現在時刻: ${state.timeNow}`;
        }

        function nextToWakeUp() {
            const val = parseInt(document.getElementById('input-duration').value, 10);
            if (isNaN(val) || val < 1) return;
            state.watchMinutes = val;
            showScreen('screen-2');
        }

        function nextToPrediction() {
            const wakeVal = document.getElementById('input-wakeup').value;
            if (!wakeVal) return;
            state.wakeUpTime = wakeVal;
            
            // 起床時間を保存
            localStorage.setItem(SETTINGS_KEY, JSON.stringify({ lastWakeUpTime: state.wakeUpTime }));

            calculatePrediction();
            showScreen('screen-3');
        }

        function calculatePrediction() {
            // 現在時刻を再取得してより正確に
            updateCurrentTime();

            const [nowH, nowM] = state.timeNow.split(':').map(Number);
            const [wakeH, wakeM] = state.wakeUpTime.split(':').map(Number);

            const nowMinutes = nowH * 60 + nowM;
            let wakeMinutes = wakeH * 60 + wakeM;

            if (wakeMinutes <= nowMinutes) {
                wakeMinutes += 24 * 60;
            }

            const sleepTimeInMinutes = wakeMinutes - (nowMinutes + state.watchMinutes);

            const displayEl = document.getElementById('sleep-time-value');
            const comparisonEl = document.getElementById('sleep-comparison');

            if (sleepTimeInMinutes < 0) {
                displayEl.innerHTML = '睡眠なし <span style="font-size:24px">💀</span>';
                displayEl.className = 'sleep-time-display sleep-bad';
            } else {
                const sleepH = Math.floor(sleepTimeInMinutes / 60);
                const sleepM = sleepTimeInMinutes % 60;
                displayEl.textContent = `${sleepH}h ${sleepM}m`;

                displayEl.className = 'sleep-time-display';
                if (sleepTimeInMinutes < 360) { // 6時間未満
                    displayEl.classList.add('sleep-bad');
                } else if (sleepTimeInMinutes < 420) { // 7時間未満
                    displayEl.classList.add('sleep-warn');
                } else {
                    displayEl.classList.add('sleep-good');
                }
            }

            const history = getHistory();
            if (history.length > 0) {
                let totalSleep = 0;
                let count = 0;
                history.forEach(record => {
                    if (record.sleepTimeInMinutes !== undefined) {
                        totalSleep += record.sleepTimeInMinutes;
                        count++;
                    }
                });

                if (count > 0) {
                    const avgSleep = Math.round(totalSleep / count);
                    const diff = sleepTimeInMinutes - avgSleep;
                    if (diff > 0) {
                        comparisonEl.textContent = `過去の平均より ${diff}分 長く眠れます✨`;
                    } else if (diff < 0) {
                        comparisonEl.textContent = `過去の平均より ${Math.abs(diff)}分 短くなります⚠️`;
                    } else {
                        comparisonEl.textContent = `いつも通りの睡眠時間です`;
                    }
                } else {
                    comparisonEl.textContent = 'しっかり睡眠をとりましょう';
                }
            } else {
                comparisonEl.textContent = '今日が最初の記録です';
            }
        }

        function nextToChoice() {
            showScreen('screen-4');
        }

        function makeChoice(choice) {
            const today = new Date();
            today.setHours(today.getHours() - 5);
            const dateStr = today.toISOString().split('T')[0];

            const [nowH, nowM] = state.timeNow.split(':').map(Number);
            const [wakeH, wakeM] = state.wakeUpTime.split(':').map(Number);
            const nowMinutes = nowH * 60 + nowM;
            let wakeMinutes = wakeH * 60 + wakeM;
            if (wakeMinutes <= nowMinutes) wakeMinutes += 24 * 60;
            const sleepTimeInMinutes = wakeMinutes - (nowMinutes + state.watchMinutes);

            const record = {
                date: dateStr,
                timeNow: state.timeNow,
                watchMinutes: state.watchMinutes,
                wakeUpTime: state.wakeUpTime,
                sleepTimeInMinutes: Math.max(0, sleepTimeInMinutes),
                choice: choice
            };

            saveRecord(record);
            renderHistory(choice);
            showScreen('screen-5');
        }

        function getHistory() {
            const data = localStorage.getItem(STORE_KEY);
            return data ? JSON.parse(data) : [];
        }

        function saveRecord(newRecord) {
            let history = getHistory();
            const existingIndex = history.findIndex(r => r.date === newRecord.date);
            if (existingIndex >= 0) {
                history[existingIndex] = newRecord;
            } else {
                history.push(newRecord);
            }
            if (history.length > 30) history = history.slice(history.length - 30);
            localStorage.setItem(STORE_KEY, JSON.stringify(history));
        }

        function renderHistory(todayChoice) {
            const resultTitle = document.getElementById('result-title');
            const resultSubtitle = document.getElementById('result-subtitle');
            
            if (todayChoice === 'slept') {
                resultTitle.textContent = '素晴らしい選択です🌙';
                resultTitle.style.color = 'var(--good)';
                resultSubtitle.textContent = '明日の自分に感謝されます。おやすみなさい。';
            } else {
                resultTitle.textContent = '時間を意識して...👀';
                resultTitle.style.color = 'var(--warn)';
                resultSubtitle.textContent = `${state.watchMinutes}分経ったら必ず閉じましょう。`;
            }

            const history = getHistory();
            const historyEl = document.getElementById('history-days');
            historyEl.innerHTML = '';

            const today = new Date();
            today.setHours(today.getHours() - 5);

            const daysOfWeek = ['日', '月', '火', '水', '木', '金', '土'];

            for (let i = 6; i >= 0; i--) {
                const d = new Date(today);
                d.setDate(d.getDate() - i);
                const dateStr = d.toISOString().split('T')[0];

                const record = history.find(r => r.date === dateStr);

                const dayDiv = document.createElement('div');
                dayDiv.className = 'history-item';

                const dayLabel = document.createElement('div');
                dayLabel.className = 'history-day';
                dayLabel.textContent = daysOfWeek[d.getDay()];

                const markDiv = document.createElement('div');
                markDiv.className = 'history-mark';

                if (record) {
                    if (record.choice === 'slept') {
                        markDiv.innerHTML = '●';
                        markDiv.classList.add('mark-good');
                    } else {
                        markDiv.innerHTML = '×';
                        markDiv.classList.add('mark-bad');
                    }
                } else {
                    markDiv.textContent = '-';
                    markDiv.classList.add('mark-none');
                }

                dayDiv.appendChild(dayLabel);
                dayDiv.appendChild(markDiv);
                historyEl.appendChild(dayDiv);
            }
        }

        init();
    </script>
</body>

</html>
